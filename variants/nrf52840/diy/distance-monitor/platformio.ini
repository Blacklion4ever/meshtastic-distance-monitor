; Distance Monitor firmware builds for the Seeed SenseCAP T1000-E.

[env:tracker-t1000-e-distance-base]
extends = env:tracker-t1000-e
build_flags =
    ${env:tracker-t1000-e.build_flags}
    -DDISTANCE_MONITOR_ENABLED=1
    -DDISTANCE_MONITOR_ROLE=1
    -DDISTANCE_MONITOR_TARGET_NODE=0x00000000
    -DDISTANCE_MONITOR_PROTOCOL_VERSION=1
    -DDISTANCE_MONITOR_FIRMWARE_VERSION=\"0.1.0-dev\"

[env:tracker-t1000-e-distance-tracker]
extends = env:tracker-t1000-e
build_flags =
    ${env:tracker-t1000-e.build_flags}
    -DDISTANCE_MONITOR_ENABLED=1
    -DDISTANCE_MONITOR_ROLE=2
    -DDISTANCE_MONITOR_TARGET_NODE=0x00000000
    -DDISTANCE_MONITOR_PROTOCOL_VERSION=1
    -DDISTANCE_MONITOR_FIRMWARE_VERSION=\"0.1.0-dev\"